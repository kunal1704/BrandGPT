# docker-compose.yml
services:
  inference:
    image: ghcr.io/huggingface/text-generation-inference:latest
    environment:
      - MODEL_ID=mistralai/Mistral-7B-Instruct-v0.1
    ports:
      - "11434:80"

  backend:
    build:
      context: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - inference
    environment:
      - PYTHONPATH=/app
    working_dir: /app

  frontend:
    build:
      context: ./frontend
    command: npm run dev
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - HOST=0.0.0.0
      - NODE_OPTIONS=--dns-result-order=ipv4first # To resolve font download issues

volumes:
  frontend_node_modules:
